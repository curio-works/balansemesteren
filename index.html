<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balansemesteren - Eksperiment</title>
    <style>
        body { 
            font-family: sans-serif; 
            background-color: #f4f4f9; 
            margin: 0; 
            padding: 20px; 
        }
        .container { 
            max-width: 1100px; 
            margin: 0 auto; 
            background: white; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        
        /* Bildeplass øverst for piksel-logo */
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo-container img {
            max-width: 100%;
            height: auto;
            image-rendering: pixelated; /* Holder pikselkunst skarp */
        }

        .kontroll-panel { 
            padding: 15px; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            flex-wrap: wrap;
            gap: 15px;
            background: #eaeaea;
        }
        button { 
            padding: 12px 20px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: bold; 
            border-radius: 5px; 
            border: none; 
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #connectBtn { background: #333; color: white; }
        #startBtn { background: #28a745; color: white; }
        #byttBtn { background: #333; color: white; }
        
        /* Oppdatert oppsett for de tre kolonnene */
        .grafer { 
            display: flex; 
            gap: 20px; 
            justify-content: center;
            align-items: center; /* Sentrerer alt i høyden */
            flex-wrap: wrap; 
        }
        .graf-boks { 
            flex: 1; 
            min-width: 250px;
            max-width: 350px; /* Gjør grafene litt mindre */
            padding: 15px; 
            border-radius: 10px; 
            background: #fafafa; 
            transition: all 0.3s ease;
        }
        canvas { 
            width: 100%; 
            border: 1px solid #ddd; 
            background: white; 
            border-radius: 5px;
        }
        
        /* Ny midtkolonne for hånden */
        .illustrasjon-midten {
            flex: 1;
            min-width: 200px;
            max-width: 300px;
            text-align: center;
        }
        .illustrasjon-midten img {
            max-width: 100%;
            height: auto;
        }

        .aktiv { border: 2px solid #333; opacity: 1; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .inaktiv { border: 1px solid #ccc; opacity: 0.4; }
        
        .score-tavle {
            background: #111;
            color: #0f0; 
            text-align: center;
            padding: 15px;
            margin-top: 15px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 24px;
            border: 3px solid #333;
        }
        
        .bytt-knapp-container { text-align: center; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo øverst -->
        <div class="logo-container">
            <img src="balansemesteren-logo.webp" alt="Balansemesteren">
        </div>

        <div class="kontroll-panel">
            <div>
                <button id="connectBtn">1. Koble til USB-mottaker</button>
                <span id="statusTekst" style="margin-left: 15px; font-weight: bold; color: #666;">Frakoblet</span>
            </div>
            <div>
                <button id="startBtn" disabled>2. Start test (15 sek)</button>
                <span id="tidtakerTekst" style="margin-left: 15px; font-weight: bold; font-size: 18px; width: 80px; display: inline-block;">Tid: 15s</span>
            </div>
            <div>
                <span style="font-size: 18px;">Aktiv: </span>
                <strong id="aktivRundeTekst" style="font-size: 18px;">Uten vekt</strong>
            </div>
        </div>

        <div class="grafer">
            <!-- Venstre graf -->
            <div class="graf-boks aktiv" id="boksUtenVekt">
                <h2 style="text-align: center; margin-top: 0;">Uten vekt</h2>
                <canvas id="canvasUtenVekt" width="500" height="500"></canvas>
                <div class="score-tavle">Stabilitet: <span id="scoreUten">--</span>%</div>
            </div>
            
            <!-- Hånd-illustrasjonen i midten -->
            <div class="illustrasjon-midten">
                <img src="balanse-haand.webp" alt="Illustrasjon av hånd som balanserer stang">
            </div>

            <!-- Høyre graf -->
            <div class="graf-boks inaktiv" id="boksMedVekt">
                <h2 style="text-align: center; margin-top: 0;">Med vekt</h2>
                <canvas id="canvasMedVekt" width="500" height="500"></canvas>
                <div class="score-tavle">Stabilitet: <span id="scoreMed">--</span>%</div>
            </div>
        </div>

        <div class="bytt-knapp-container">
            <button id="byttBtn">Bytt til "Med vekt" ↔️</button>
        </div>
    </div>

    <script>
        let aktivRunde = 'uten_vekt';
        let historikkUtenVekt = [];
        let historikkMedVekt = [];
        let gjeldendeX = 0;
        
        let timerKjorer = false;
        let gjenvaerendeTid = 15;
        let timerIntervall;

        const canvasUtenVekt = document.getElementById('canvasUtenVekt');
        const ctxUten = canvasUtenVekt.getContext('2d');
        const canvasMedVekt = document.getElementById('canvasMedVekt');
        const ctxMed = canvasMedVekt.getContext('2d');
        
        const statusTekst = document.getElementById('statusTekst');
        const aktivRundeTekst = document.getElementById('aktivRundeTekst');
        const tidtakerTekst = document.getElementById('tidtakerTekst');
        
        const connectBtn = document.getElementById('connectBtn');
        const startBtn = document.getElementById('startBtn');
        const byttBtn = document.getElementById('byttBtn');
        const boksUtenVekt = document.getElementById('boksUtenVekt');
        const boksMedVekt = document.getElementById('boksMedVekt');
        
        const scoreUten = document.getElementById('scoreUten');
        const scoreMed = document.getElementById('scoreMed');

        function tegnGraf(ctx, historikk) {
            const bredde = 500;
            const hoyde = 500;
            
            ctx.clearRect(0, 0, bredde, hoyde);
            
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;
            for (let i = 1; i < 4; i++) {
                ctx.beginPath(); ctx.moveTo(i * (bredde/4), 0); ctx.lineTo(i * (bredde/4), hoyde); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i * (hoyde/4)); ctx.lineTo(bredde, i * (hoyde/4)); ctx.stroke();
            }
            
            ctx.strokeStyle = '#999';
            ctx.beginPath(); ctx.moveTo(bredde/2, 0); ctx.lineTo(bredde/2, hoyde); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, hoyde/2); ctx.lineTo(bredde, hoyde/2); ctx.stroke();

            if (historikk.length > 1) {
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(255, 0, 0, 0.5)';
                ctx.lineWidth = 2;
                ctx.moveTo(historikk[0].x, historikk[0].y);
                for (let i = 1; i < historikk.length; i++) {
                    ctx.lineTo(historikk[i].x, historikk[i].y);
                }
                ctx.stroke();
            }

            if (historikk.length > 0) {
                const siste = historikk[historikk.length - 1];
                ctx.fillStyle = 'red';
                ctx.beginPath();
                ctx.arc(siste.x, siste.y, 6, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        tegnGraf(ctxUten, historikkUtenVekt);
        tegnGraf(ctxMed, historikkMedVekt);

        startBtn.addEventListener('click', () => {
            if (timerKjorer) return;
            
            if (aktivRunde === 'uten_vekt') {
                historikkUtenVekt = [];
                scoreUten.innerText = '--';
                tegnGraf(ctxUten, historikkUtenVekt);
            } else {
                historikkMedVekt = [];
                scoreMed.innerText = '--';
                tegnGraf(ctxMed, historikkMedVekt);
            }

            timerKjorer = true;
            gjenvaerendeTid = 15;
            tidtakerTekst.innerText = `Tid: ${gjenvaerendeTid}s`;
            
            startBtn.disabled = true;
            byttBtn.disabled = true;

            timerIntervall = setInterval(() => {
                gjenvaerendeTid--;
                tidtakerTekst.innerText = `Tid: ${gjenvaerendeTid}s`;
                
                if (gjenvaerendeTid <= 0) {
                    clearInterval(timerIntervall);
                    timerKjorer = false;
                    startBtn.disabled = false;
                    byttBtn.disabled = false;
                    tidtakerTekst.innerText = "Ferdig!";
                    
                    let aktivHistorikk = aktivRunde === 'uten_vekt' ? historikkUtenVekt : historikkMedVekt;
                    let aktivScoreFelt = aktivRunde === 'uten_vekt' ? scoreUten : scoreMed;
                    
                    if (aktivHistorikk.length > 0) {
                        let totalAvstand = 0;
                        for (let pkt of aktivHistorikk) {
                            let dx = pkt.x - 250;
                            let dy = pkt.y - 250;
                            totalAvstand += Math.sqrt(dx * dx + dy * dy);
                        }
                        
                        let snittAvstand = totalAvstand / aktivHistorikk.length;
                        let stabilitet = 100 - ((snittAvstand / 250) * 100);
                        if (stabilitet < 0) stabilitet = 0;
                        
                        aktivScoreFelt.innerText = stabilitet.toFixed(1);
                    } else {
                        aktivScoreFelt.innerText = "0.0";
                    }
                }
            }, 1000);
        });

        byttBtn.addEventListener('click', () => {
            if (timerKjorer) return; 
            
            if (aktivRunde === 'uten_vekt') {
                aktivRunde = 'med_vekt';
                aktivRundeTekst.innerText = 'Med vekt';
                byttBtn.innerText = 'Bytt til "Uten vekt" ↔️';
                
                boksUtenVekt.classList.remove('aktiv');
                boksUtenVekt.classList.add('inaktiv');
                boksMedVekt.classList.remove('inaktiv');
                boksMedVekt.classList.add('aktiv');
            } else {
                aktivRunde = 'uten_vekt';
                aktivRundeTekst.innerText = 'Uten vekt';
                byttBtn.innerText = 'Bytt til "Med vekt" ↔️';
                
                boksMedVekt.classList.remove('aktiv');
                boksMedVekt.classList.add('inaktiv');
                boksUtenVekt.classList.remove('inaktiv');
                boksUtenVekt.classList.add('aktiv');
            }
        });

        connectBtn.addEventListener('click', async () => {
            try {
                const port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                
                statusTekst.innerText = "Tilkoblet";
                statusTekst.style.color = "green";
                startBtn.disabled = false; 

                const textDecoder = new TextDecoderStream();
                port.readable.pipeTo(textDecoder.writable);
                const reader = textDecoder.readable.getReader();
                
                let buffer = "";

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    
                    buffer += value;
                    let linjer = buffer.split('\n');
                    buffer = linjer.pop();

                    for (let linje of linjer) {
                        linje = linje.trim();
                        
                        if (linje.includes('Tilt_X:')) {
                            gjeldendeX = parseFloat(linje.split('Tilt_X:')[1]);
                        } 
                        else if (linje.includes('Tilt_Z:')) {
                            const gjeldendeZ = parseFloat(linje.split('Tilt_Z:')[1]);

                            if (timerKjorer) {
                                const xPos = ((gjeldendeX + 1100) / 2200) * 500;
                                const yPos = ((1100 - gjeldendeZ) / 2200) * 500;

                                if (aktivRunde === 'uten_vekt') {
                                    historikkUtenVekt.push({ x: xPos, y: yPos });
                                    tegnGraf(ctxUten, historikkUtenVekt);
                                } else {
                                    historikkMedVekt.push({ x: xPos, y: yPos });
                                    tegnGraf(ctxMed, historikkMedVekt);
                                }
                            }
                        }
                    }
                }
            } catch (feil) {
                console.error("Seriell feil:", feil);
                statusTekst.innerText = "Tilkoblingsfeil";
                statusTekst.style.color = "red";
            }
        });
    </script>
</body>
</html>
