<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balansemesteren - Eksperiment</title>
    <style>
        body { 
            font-family: sans-serif; 
            background-color: #f4f4f9; 
            margin: 0; 
            padding: 15px; 
        }
        .container { 
            max-width: 1350px; /* Gjort bredere for å få plass til lister på sidene */
            margin: 0 auto; 
            background: white; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 15px;
        }
        .logo-container img {
            max-width: 100%;
            height: auto;
            image-rendering: pixelated; 
        }

        .kontroll-panel { 
            padding: 15px; 
            border-radius: 10px; 
            margin-bottom: 15px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            flex-wrap: wrap;
            gap: 15px;
            background: #eaeaea;
        }
        
        .start-gruppe {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        #navneFelt {
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            width: 180px;
        }

        button { 
            padding: 12px 20px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: bold; 
            border-radius: 5px; 
            border: none; 
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #connectBtn { background: #333; color: white; }
        #startBtn { background: #28a745; color: white; }
        #byttBtn { background: #333; color: white; }
        
        /* Oppdatert oppsett for 5 kolonner */
        .grafer { 
            display: flex; 
            gap: 15px; 
            justify-content: center;
            align-items: flex-start; /* Sørger for at boksene henger fra toppen */
            flex-wrap: wrap; 
        }
        
        /* Design på poenglistene på sidene */
        .liste-boks {
            flex: 1;
            min-width: 160px;
            max-width: 220px;
            background: #fff;
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 15px;
            max-height: 430px; /* Gjør at listen ruller inni boksen, ikke på nettsiden */
            overflow-y: auto;
        }
        .liste-boks h3 {
            margin-top: 0;
            font-size: 16px;
            text-align: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            color: #333;
        }
        .resultat-liste {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .resultat-liste li {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f4f4f9;
            font-size: 14px;
            font-family: monospace;
        }

        .graf-boks { 
            flex: 2; 
            min-width: 220px;
            max-width: 320px; 
            padding: 15px; 
            border-radius: 10px; 
            background: #fafafa; 
            transition: all 0.3s ease;
        }
        canvas { 
            width: 100%; 
            border: 1px solid #ddd; 
            background: white; 
            border-radius: 5px;
            aspect-ratio: 1 / 1;
        }
        
        .illustrasjon-midten {
            flex: 1;
            min-width: 130px;
            max-width: 180px;
            text-align: center;
            align-self: center; /* Holder illustrasjonen sentrert vertikalt */
        }
        .illustrasjon-midten img {
            max-width: 100%; 
            height: auto;
        }

        .aktiv { border: 2px solid #333; opacity: 1; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .inaktiv { border: 1px solid #ccc; opacity: 0.4; }
        
        .score-tavle {
            background: #111;
            color: #0f0; 
            text-align: center;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 20px;
            border: 3px solid #333;
        }
        
        .bytt-knapp-container { text-align: center; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <img src="balansemesteren-logo.webp" alt="Balansemesteren">
        </div>

        <div class="kontroll-panel">
            <div>
                <button id="connectBtn">1. Koble til USB</button>
                <span id="statusTekst" style="margin-left: 15px; font-weight: bold; color: #666;">Frakoblet</span>
            </div>
            <div class="start-gruppe">
                <input type="text" id="navneFelt" placeholder="Deltakernavn">
                <button id="startBtn" disabled>2. Start test (15s)</button>
                <span id="tidtakerTekst" style="margin-left: 10px; font-weight: bold; font-size: 18px; width: 70px; display: inline-block;">Tid: 15s</span>
            </div>
            <div>
                <span style="font-size: 18px;">Aktiv: </span>
                <strong id="aktivRundeTekst" style="font-size: 18px;">Uten vekt</strong>
            </div>
        </div>

        <div class="grafer">
            <!-- Liste venstre (Uten vekt) -->
            <div class="liste-boks">
                <h3>Poeng Uten Vekt</h3>
                <ul class="resultat-liste" id="listeUten"></ul>
            </div>

            <!-- Graf venstre -->
            <div class="graf-boks aktiv" id="boksUtenVekt">
                <h2 style="text-align: center; margin-top: 0;">Uten vekt</h2>
                <canvas id="canvasUtenVekt" width="500" height="500"></canvas>
                <div class="score-tavle">Score: <span id="scoreUten">--</span>%</div>
            </div>
            
            <!-- Hånd-illustrasjon midten -->
            <div class="illustrasjon-midten">
                <img src="balanse-haand.webp" alt="Illustrasjon av hånd som balanserer stang">
            </div>

            <!-- Graf høyre -->
            <div class="graf-boks inaktiv" id="boksMedVekt">
                <h2 style="text-align: center; margin-top: 0;">Med vekt</h2>
                <canvas id="canvasMedVekt" width="500" height="500"></canvas>
                <div class="score-tavle">Score: <span id="scoreMed">--</span>%</div>
            </div>

            <!-- Liste høyre (Med vekt) -->
            <div class="liste-boks">
                <h3>Poeng Med Vekt</h3>
                <ul class="resultat-liste" id="listeMed"></ul>
            </div>
        </div>

        <div class="bytt-knapp-container">
            <button id="byttBtn">Bytt til "Med vekt" ↔️</button>
        </div>
    </div>

    <script>
        let aktivRunde = 'uten_vekt';
        let historikkUtenVekt = [];
        let historikkMedVekt = [];
        let gjeldendeX = 0;
        
        let timerKjorer = false;
        let gjenvaerendeTid = 15;
        let timerIntervall;

        const canvasUtenVekt = document.getElementById('canvasUtenVekt');
        const ctxUten = canvasUtenVekt.getContext('2d');
        const canvasMedVekt = document.getElementById('canvasMedVekt');
        const ctxMed = canvasMedVekt.getContext('2d');
        
        const statusTekst = document.getElementById('statusTekst');
        const aktivRundeTekst = document.getElementById('aktivRundeTekst');
        const tidtakerTekst = document.getElementById('tidtakerTekst');
        const navneFelt = document.getElementById('navneFelt');
        
        const connectBtn = document.getElementById('connectBtn');
        const startBtn = document.getElementById('startBtn');
        const byttBtn = document.getElementById('byttBtn');
        const boksUtenVekt = document.getElementById('boksUtenVekt');
        const boksMedVekt = document.getElementById('boksMedVekt');
        
        const scoreUten = document.getElementById('scoreUten');
        const scoreMed = document.getElementById('scoreMed');
        const listeUten = document.getElementById('listeUten');
        const listeMed = document.getElementById('listeMed');

        function tegnGraf(ctx, historikk) {
            const bredde = 500;
            const hoyde = 500;
            
            ctx.clearRect(0, 0, bredde, hoyde);
            
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;
            for (let i = 1; i < 4; i++) {
                ctx.beginPath(); ctx.moveTo(i * (bredde/4), 0); ctx.lineTo(i * (bredde/4), hoyde); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i * (hoyde/4)); ctx.lineTo(bredde, i * (hoyde/4)); ctx.stroke();
            }
            
            ctx.strokeStyle = '#999';
            ctx.beginPath(); ctx.moveTo(bredde/2, 0); ctx.lineTo(bredde/2, hoyde); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, hoyde/2); ctx.lineTo(bredde, hoyde/2); ctx.stroke();

            if (historikk.length > 1) {
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(255, 0, 0, 0.5)';
                ctx.lineWidth = 2;
                ctx.moveTo(historikk[0].x, historikk[0].y);
                for (let i = 1; i < historikk.length; i++) {
                    ctx.lineTo(historikk[i].x, historikk[i].y);
                }
                ctx.stroke();
            }

            if (historikk.length > 0) {
                const siste = historikk[historikk.length - 1];
                ctx.fillStyle = 'red';
                ctx.beginPath();
                ctx.arc(siste.x, siste.y, 6, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        tegnGraf(ctxUten, historikkUtenVekt);
        tegnGraf(ctxMed, historikkMedVekt);

        startBtn.addEventListener('click', () => {
            if (timerKjorer) return;
            
            if (aktivRunde === 'uten_vekt') {
                historikkUtenVekt = [];
                scoreUten.innerText = '--';
                tegnGraf(ctxUten, historikkUtenVekt);
            } else {
                historikkMedVekt = [];
                scoreMed.innerText = '--';
                tegnGraf(ctxMed, historikkMedVekt);
            }

            timerKjorer = true;
            gjenvaerendeTid = 15;
            tidtakerTekst.innerText = `Tid: ${gjenvaerendeTid}s`;
            
            startBtn.disabled = true;
            byttBtn.disabled = true;
            navneFelt.disabled = true;

            timerIntervall = setInterval(() => {
                gjenvaerendeTid--;
                tidtakerTekst.innerText = `Tid: ${gjenvaerendeTid}s`;
                
                if (gjenvaerendeTid <= 0) {
                    clearInterval(timerIntervall);
                    timerKjorer = false;
                    startBtn.disabled = false;
                    byttBtn.disabled = false;
                    navneFelt.disabled = false;
                    tidtakerTekst.innerText = "Ferdig!";
                    
                    let aktivHistorikk = aktivRunde === 'uten_vekt' ? historikkUtenVekt : historikkMedVekt;
                    let aktivScoreFelt = aktivRunde === 'uten_vekt' ? scoreUten : scoreMed;
                    let aktivListe = aktivRunde === 'uten_vekt' ? listeUten : listeMed;
                    let spillerNavn = navneFelt.value.trim() || 'Gjest';
                    let sluttPoeng = "0.0";
                    
                    if (aktivHistorikk.length > 0) {
                        let totalAvstand = 0;
                        for (let pkt of aktivHistorikk) {
                            let dx = pkt.x - 250;
                            let dy = pkt.y - 250;
                            totalAvstand += Math.sqrt(dx * dx + dy * dy);
                        }
                        
                        let snittAvstand = totalAvstand / aktivHistorikk.length;
                        let stabilitet = 100 - ((snittAvstand / 250) * 100);
                        if (stabilitet < 0) stabilitet = 0;
                        
                        sluttPoeng = stabilitet.toFixed(1);
                    }
                    
                    // Oppdater storskjermen
                    aktivScoreFelt.innerText = sluttPoeng;
                    
                    // Legg til i resultatlisten
                    let li = document.createElement('li');
                    let spanNavn = document.createElement('span');
                    spanNavn.innerText = spillerNavn;
                    let spanScore = document.createElement('strong');
                    spanScore.innerText = sluttPoeng + '%';
                    
                    li.appendChild(spanNavn);
                    li.appendChild(spanScore);
                    aktivListe.appendChild(li);
                    
                    // Tøm navnefeltet slik at det er klart for neste deltaker
                    navneFelt.value = '';
                }
            }, 1000);
        });

        byttBtn.addEventListener('click', () => {
            if (timerKjorer) return; 
            
            if (aktivRunde === 'uten_vekt') {
                aktivRunde = 'med_vekt';
                aktivRundeTekst.innerText = 'Med vekt';
                byttBtn.innerText = 'Bytt til "Uten vekt" ↔️';
                
                boksUtenVekt.classList.remove('aktiv');
                boksUtenVekt.classList.add('inaktiv');
                boksMedVekt.classList.remove('inaktiv');
                boksMedVekt.classList.add('aktiv');
            } else {
                aktivRunde = 'uten_vekt';
                aktivRundeTekst.innerText = 'Uten vekt';
                byttBtn.innerText = 'Bytt til "Med vekt" ↔️';
                
                boksMedVekt.classList.remove('aktiv');
                boksMedVekt.classList.add('inaktiv');
