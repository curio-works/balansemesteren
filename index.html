<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balansemesteren - Eksperiment</title>
    <style>
        body { 
            font-family: sans-serif; 
            background-color: #f4f4f9; 
            margin: 0; 
            padding: 10px; 
        }
        .container { 
            position: relative; 
            max-width: 1300px; 
            margin: 15px auto; 
            background: white; 
            padding: 15px; 
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        
        .bakgrunns-bilde {
            position: absolute;
            top: 10px;    
            bottom: 10px; 
            left: 50%;
            transform: translateX(-50%);
            z-index: 0; 
            pointer-events: none; 
            display: flex;
            justify-content: center;
            align-items: center; 
        }
        .bakgrunns-bilde img {
            max-width: 140px; 
            max-height: 100%; 
            height: auto;
            object-fit: contain; 
            opacity: 1; 
        }

        .logo-container, .kontroll-panel, .grafer {
            position: relative;
            z-index: 2;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 10px; 
        }
        .logo-container img {
            max-width: 100%;
            max-height: 120px; /* Doblet høyden fra 60px til 120px */
            height: auto;
            image-rendering: pixelated; 
        }

        .kontroll-panel { 
            padding: 10px 15px; 
            border-radius: 10px; 
            margin-bottom: 15px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            flex-wrap: wrap;
            gap: 10px;
            background: #eaeaea;
        }
        
        .tilkobling-gruppe, .start-gruppe {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        #navneFelt {
            padding: 10px; 
            font-size: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
            width: 160px;
        }

        button { 
            padding: 10px 15px; 
            font-size: 15px; 
            cursor: pointer; 
            font-weight: bold; 
            border-radius: 5px; 
            border: none; 
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #connectBtn { background: #333; color: white; }
        .start-test-trigger { background: #28a745; color: white; }
        #byttBtn { background: #333; color: white; }
        
        .grafer { 
            display: flex; 
            gap: 10px; 
            justify-content: center;
            align-items: flex-start; 
            flex-wrap: wrap; 
        }
        
        .liste-boks {
            flex: 1;
            min-width: 150px;
            max-width: 200px;
            background: #fff;
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 10px; 
            max-height: 350px; 
            overflow-y: auto;
        }
        .liste-boks h3 {
            margin-top: 0;
            font-size: 15px;
            text-align: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px; 
            margin-bottom: 5px;
            color: #333;
        }
        .resultat-liste {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .resultat-liste li {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #f4f4f9;
            font-size: 13px;
            font-family: monospace;
        }

        .graf-boks { 
            flex: 2; 
            min-width: 200px;
            max-width: 280px; 
            padding: 10px; 
            border-radius: 10px; 
            background: #fafafa; 
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        
        .graf-boks h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 5px; 
            font-size: 1.2em;
        }

        canvas { 
            width: 100%; 
            border: 1px solid #ddd; 
            background: white; 
            border-radius: 5px;
            aspect-ratio: 1 / 1;
        }
        
        .illustrasjon-midten {
            flex: 1;
            min-width: 100px;
            max-width: 150px;
        }

        .aktiv { border: 2px solid #333; opacity: 1; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .inaktiv { border: 1px solid #ccc; opacity: 0.4; }
        
        .score-tavle {
            background: #111;
            color: #2196F3;
            text-align: center;
            padding: 5px 10px; 
            margin-top: 8px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 16px; 
            border: 2px solid #333;
        }

        /* --- KONTROLLER UNDER GRAF --- */
        .fullskjerm-kontroller {
            text-align: center;
            margin-top: 8px; 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        
        .fullskjerm-btn {
            background-color: #ddd;
            color: #333;
            border: none;
            padding: 6px 12px; 
            font-size: 13px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        .fullskjerm-btn:hover { background-color: #ccc; }

        .start-fullskjerm-btn, .tid-visning-fullskjerm {
            display: none; 
        }

        /* --- STIL NÅR GRAFEN ER I FULLSKJERM --- */
        .graf-boks:fullscreen {
            background: #fafafa;
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            padding: 40px;
            box-sizing: border-box; 
            position: relative; 
            
            display: grid;
            grid-template-columns: 250px 1fr 250px; 
            grid-template-rows: 1fr; 
            align-items: center;
        }
        
        .graf-boks:fullscreen h2 {
            position: absolute;
            top: 100px;  
            left: 40px;  
            width: 250px; 
            font-size: 3em; 
            margin: 0;
            text-align: center; 
        }

        .graf-boks:fullscreen canvas {
            grid-column: 2; 
            grid-row: 1; 
            height: 90vh; 
            width: auto;  
            margin: 0 auto; 
        }

        .graf-boks:fullscreen .fullskjerm-kontroller {
            grid-column: 1;
            grid-row: 1; 
            display: flex;
            flex-direction: column; 
            gap: 30px;
            margin-top: 80px; 
            justify-content: center; 
        }

        .graf-boks:fullscreen .score-tavle {
            grid-column: 3;
            grid-row: 1; 
            font-size: 28px; 
            padding: 30px;
            margin-top: 0;
            display: flex;
            flex-direction: column; 
            justify-content: center; 
            border-width: 3px; 
        }

        .graf-boks:fullscreen .score-tavle span {
            display: block; 
            font-size: 80px; 
            font-weight: bold;
            margin-top: 15px;
        }

        .graf-boks:fullscreen .fullskjerm-btn {
            font-size: 20px;
            padding: 15px 30px;
            background-color: #e74c3c; 
            color: white;
            width: 100%; 
        }
        
        .graf-boks:fullscreen .start-fullskjerm-btn {
            display: block;
            font-size: 20px;
            padding: 15px 30px;
            width: 100%;
        }
        
        .graf-boks:fullscreen .tid-visning-fullskjerm {
            display: block;
            font-size: 32px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="bakgrunns-bilde">
            <img src="balanse-haand.webp" alt="Bakgrunnsillustrasjon">
        </div>

        <div class="logo-container">
            <img src="balansemesteren-logo.webp" alt="Balansemesteren">
        </div>

        <div class="kontroll-panel">
            <div class="tilkobling-gruppe">
                <button id="connectBtn">1. Koble til USB</button>
                <span id="statusTekst" style="font-weight: bold; color: #666; min-width: 80px;">Frakoblet</span>
                <button id="byttBtn">Bytt til "Med vekt" ↔️</button>
            </div>
            
            <div class="start-gruppe">
                <input type="text" id="navneFelt" placeholder="Deltakernavn">
                <button class="start-test-trigger" disabled>2. Start test (15s)</button>
                <span class="tidtaker-tekst-felles" style="margin-left: 10px; font-weight: bold; font-size: 18px; width: 60px; display: inline-block;">Tid: 15s</span>
            </div>
            
            <div>
                <span style="font-size: 16px;">Aktiv: </span>
                <strong id="aktivRundeTekst" style="font-size: 16px;">Uten vekt</strong>
            </div>
        </div>

        <div class="grafer">
            <div class="liste-boks">
                <h3>Poeng Uten Vekt</h3>
                <ul class="resultat-liste" id="listeUten"></ul>
            </div>

            <!-- GRAF-BOKS 1 (UTEN VEKT) -->
            <div class="graf-boks aktiv" id="boksUtenVekt">
                <h2>Uten vekt</h2>
                <canvas id="canvasUtenVekt" width="500" height="500"></canvas>
                <div class="score-tavle">Vingle-score: <span id="scoreUten">0</span></div>
                
                <div class="fullskjerm-kontroller">
                    <button class="start-fullskjerm-btn start-test-trigger" disabled>Start test</button>
                    <div class="tid-visning-fullskjerm tidtaker-tekst-felles">Tid: 15s</div>
                    <button class="fullskjerm-btn" onclick="toggleFullskjerm('boksUtenVekt')">Forstørr ⛶</button>
                </div>
            </div>
            
            <div class="illustrasjon-midten"></div>

            <!-- GRAF-BOKS 2 (MED VEKT) -->
            <div class="graf-boks inaktiv" id="boksMedVekt">
                <h2>Med vekt</h2>
                <canvas id="canvasMedVekt" width="500" height="500"></canvas>
                <div class="score-tavle">Vingle-score: <span id="scoreMed">0</span></div>
                
                <div class="fullskjerm-kontroller">
                    <button class="start-fullskjerm-btn start-test-trigger" disabled>Start test</button>
                    <div class="tid-visning-fullskjerm tidtaker-tekst-felles">Tid: 15s</div>
                    <button class="fullskjerm-btn" onclick="toggleFullskjerm('boksMedVekt')">Forstørr ⛶</button>
                </div>
            </div>

            <div class="liste-boks">
                <h3>Poeng Med Vekt</h3>
                <ul class="resultat-liste" id="listeMed"></ul>
            </div>
        </div>
    </div>

    <script>
        let port;
        let reader;
        
        let lastX = 0;
        let lastY = 0;
        let offsetX = 0;
        let offsetY = 0;
        let isCalibrated = false;
        
        let totalDistance = 0;
        let readingCount = 0;
        
        let aktivRunde = 'uten_vekt';
        let historikkUtenVekt = [];
        let historikkMedVekt = [];
        const maxDataPoints = 150; 
        
        let timerKjorer = false;
        let testDuration = 15;
        let gjenvaerendeTid = testDuration;
        let timerIntervall;

        const canvasUtenVekt = document.getElementById('canvasUtenVekt');
        const ctxUten = canvasUtenVekt.getContext('2d');
        const canvasMedVekt = document.getElementById('canvasMedVekt');
        const ctxMed = canvasMedVekt.getContext('2d');
        
        const statusTekst = document.getElementById('statusTekst');
        const aktivRundeTekst = document.getElementById('aktivRundeTekst');
        const navneFelt = document.getElementById('navneFelt');
        
        const connectBtn = document.getElementById('connectBtn');
        const byttBtn = document.getElementById('byttBtn');
        const boksUtenVekt = document.getElementById('boksUtenVekt');
        const boksMedVekt = document.getElementById('boksMedVekt');
        
        const scoreUten = document.getElementById('scoreUten');
        const scoreMed = document.getElementById('scoreMed');
        const listeUten = document.getElementById('listeUten');
        const listeMed = document.getElementById('listeMed');

        const alleStartKnapper = document.querySelectorAll('.start-test-trigger');
        const alleTidtakerTekster = document.querySelectorAll('.tidtaker-tekst-felles');

        function settStartKnapper(statusDisabled) {
            alleStartKnapper.forEach(btn => btn.disabled = statusDisabled);
        }
        function oppdaterTidTekst(tekst) {
            alleTidtakerTekster.forEach(el => el.innerText = tekst);
        }

        // --- FULLSKJERM-LOGIKK ---
        function toggleFullskjerm(boksId) {
            const boks = document.getElementById(boksId);
            if (!document.fullscreenElement) {
                boks.requestFullscreen().catch(err => {
                    console.log(`Feil ved fullskjerm: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        document.addEventListener('fullscreenchange', () => {
            const alleFullskjermKnapper = document.querySelectorAll('.fullskjerm-btn');
            if (document.fullscreenElement) {
                const aktivBoks = document.fullscreenElement;
                const knapp = aktivBoks.querySelector('.fullskjerm-btn');
                if (knapp) knapp.innerText = "Forminsk ✖";
            } else {
                alleFullskjermKnapper.forEach(btn => btn.innerText = "Forstørr ⛶");
            }
        });

        function tegnGraf(ctx, historikk) {
            const bredde = 500;
            const hoyde = 500;
            ctx.clearRect(0, 0, bredde, hoyde);
            
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;
            for (let i = 1; i < 4; i++) {
                ctx.beginPath(); ctx.moveTo(i * (bredde/4), 0); ctx.lineTo(i * (bredde/4), hoyde); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i * (hoyde/4)); ctx.lineTo(bredde, i * (hoyde/4)); ctx.stroke();
            }
            
            ctx.strokeStyle = '#999';
            ctx.beginPath(); ctx.moveTo(bredde/2, 0); ctx.lineTo(bredde/2, hoyde); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, hoyde/2); ctx.lineTo(bredde, hoyde/2); ctx.stroke();

            if (historikk.length > 1) {
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(255, 99, 132, 0.8)';
                ctx.lineWidth = 2;
                ctx.moveTo(historikk[0].x, historikk[0].y);
                for (let i = 1; i < historikk.length; i++) {
                    ctx.lineTo(historikk[i].x, historikk[i].y);
                }
                ctx.stroke();
            }

            if (historikk.length > 0) {
                const siste = historikk[historikk.length - 1];
                ctx.fillStyle = 'rgba(255, 99, 132, 1)';
                ctx.beginPath();
                ctx.arc(siste.x, siste.y, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        tegnGraf(ctxUten, historikkUtenVekt);
        tegnGraf(ctxMed, historikkMedVekt);

        byttBtn.addEventListener('click', () => {
            if (timerKjorer) return; 
            if (aktivRunde === 'uten_vekt') {
                aktivRunde = 'med_vekt';
                aktivRundeTekst.innerText = 'Med vekt';
                byttBtn.innerText = 'Bytt til "Uten vekt" ↔️';
                boksUtenVekt.classList.replace('aktiv', 'inaktiv');
                boksMedVekt.classList.replace('inaktiv', 'aktiv');
            } else {
                aktivRunde = 'uten_vekt';
                aktivRundeTekst.innerText = 'Uten vekt';
                byttBtn.innerText = 'Bytt til "Med vekt" ↔️';
                boksMedVekt.classList.replace('aktiv', 'inaktiv');
                boksUtenVekt.classList.replace('inaktiv', 'aktiv');
            }
        });

        connectBtn.addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                
                statusTekst.innerText = "✅ Tilkoblet";
                statusTekst.style.color = "#4CAF50";
                
                settStartKnapper(false);

                const textDecoder = new TextDecoderStream();
                port.readable.pipeTo(textDecoder.writable);
                reader = textDecoder.readable.getReader();
                
                let buffer = "";

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    
                    buffer += value;
                    let lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (let line of lines) {
                        line = line.trim();
                        if (line) parseAndDrawXY(line);
                    }
                }
            } catch (error) {
                console.error("Tilkobling avbrutt eller feilet:", error);
            }
        });

        function parseAndDrawXY(line) {
            let parts = line.split(":");
            if (parts.length === 2) {
                let label = parts[0].trim();
                let value = parseFloat(parts[1].trim());
                
                if (label === "Tilt_Z") {
                    lastY = value;
                } 
                else if (label === "Tilt_X") {
                    lastX = value;
                    
                    if (timerKjorer) {
                        if (!isCalibrated) {
                            offsetX = lastX;
                            offsetY = lastY;
                            isCalibrated = true;
                        }
                        
                        let adjustedX = lastX - offsetX;
                        let adjustedY = lastY - offsetY;

                        let distance = Math.sqrt((adjustedX * adjustedX) + (adjustedY * adjustedY));
                        totalDistance += distance;
                        readingCount++;
                        
                        let averageWobble = totalDistance / readingCount;
                        let aktivScoreFelt = aktivRunde === 'uten_vekt' ? scoreUten : scoreMed;
                        aktivScoreFelt.innerText = Math.round(averageWobble);
                        
                        const xPos = 250 + ((adjustedX / 1100) * 250);
                        const yPos = 250 + ((adjustedY / 1100) * 250);

                        if (aktivRunde === 'uten_vekt') {
                            historikkUtenVekt.push({ x: xPos, y: yPos });
                            if (historikkUtenVekt.length > maxDataPoints) historikkUtenVekt.shift();
                            tegnGraf(ctxUten, historikkUtenVekt);
                        } else {
                            historikkMedVekt.push({ x: xPos, y: yPos });
                            if (historikkMedVekt.length > maxDataPoints) historikkMedVekt.shift();
                            tegnGraf(ctxMed, historikkMedVekt);
                        }
                    }
                }
            }
        }

        function startEksperiment() {
            if (timerKjorer) return;
            
            timerKjorer = true;
            isCalibrated = false; 
            totalDistance = 0;
            readingCount = 0;
            
            if (aktivRunde === 'uten_vekt') {
                historikkUtenVekt = [];
                scoreUten.innerText = '0';
                tegnGraf(ctxUten, historikkUtenVekt);
            } else {
                historikkMedVekt = [];
                scoreMed.innerText = '0';
                tegnGraf(ctxMed, historikkMedVekt);
            }

            gjenvaerendeTid = testDuration;
            oppdaterTidTekst(`Tid: ${gjenvaerendeTid}s`);
            
            settStartKnapper(true);
            byttBtn.disabled = true;
            navneFelt.disabled = true;

            timerIntervall = setInterval(() => {
                gjenvaerendeTid--;
                oppdaterTidTekst(`Tid: ${gjenvaerendeTid}s`);
                
                if (gjenvaerendeTid <= 0) {
                    clearInterval(timerIntervall);
                    timerKjorer = false;
                    
                    settStartKnapper(false);
                    byttBtn.disabled = false;
                    navneFelt.disabled = false;
                    oppdaterTidTekst("Ferdig!");
                    
                    let aktivScoreFelt = aktivRunde === 'uten_vekt' ? scoreUten : scoreMed;
                    let aktivListe = aktivRunde === 'uten_vekt' ? listeUten : listeMed;
                    let spillerNavn = navneFelt.value.trim() || 'Gjest';
                    let sluttPoeng = aktivScoreFelt.innerText;
                    
                    let li = document.createElement('li');
                    let spanNavn = document.createElement('span');
                    spanNavn.innerText = spillerNavn;
                    let spanScore = document.createElement('strong');
                    spanScore.innerText = sluttPoeng;
                    
                    li.appendChild(spanNavn);
                    li.appendChild(spanScore);
                    aktivListe.appendChild(li);
                    
                    navneFelt.value = '';
                }
            }, 1000);
        }

        alleStartKnapper.forEach(btn => {
            btn.addEventListener('click', startEksperiment);
        });

    </script>
</body>
</html>
