<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Balansemesteren - Stem</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        /* Sikrer at siden fyller hele mobilskjermen og forhindrer scrolling/zooming */
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(to bottom, #21a3c0, #093E4A);
            min-height: 100vh;
            margin: 0; 
            padding: 15px; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Hovedkortet */
        .vote-card {
            background: #ffffff;
            border: 6px solid #093E4A;
            border-radius: 12px;
            padding: 40px 20px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            position: relative;
            box-sizing: border-box;
        }

        /* Retro-overskriften */
        .arcade-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 26px;
            color: #093E4A;
            margin-bottom: 15px;
            text-shadow: 2px 2px 0px #92D3E2;
            line-height: 1.4;
        }

        .question-text {
            font-size: 19px;
            font-weight: 700;
            color: #333;
            margin-bottom: 35px;
            line-height: 1.5;
        }

        /* --- DE GIGANTISKE NØYTRALE KNAPPENE --- */
        .vote-btn {
            display: flex;
            align-items: center;
            width: 100%;
            min-height: 170px;
            padding: 15px;
            margin-bottom: 25px;
            font-family: 'Press Start 2P', monospace;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.1s;
            text-shadow: 4px 4px 0px #1B447A; 
            
            -webkit-user-select: none;
            user-select: none;
        }

        /* Felles blåfarge for begge knappene */
        .btn-neutral {
            background: #3FA9F5;
            border-bottom: 10px solid #2478B4;
        }
        
        .btn-neutral:active { 
            transform: translateY(10px); 
            border-bottom: 0px solid #2478B4; 
            margin-bottom: 35px; 
        }

        /* Oppsett for ikon og tekst inni knappen */
        .btn-icon {
            flex: 0 0 120px; 
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: 35px; /* Økt fra 20px for å trekke ikonene mer mot midten */
        }

        .btn-text {
            flex-grow: 1; 
            text-align: center;
            font-size: 33px; 
            line-height: 1.4;
            padding-right: 35px; /* Matchende avstand for perfekt visuell symmetri */
        }

        /* Takkemeldingen som dukker opp etter stemmegivning */
        #thank-you-screen {
            display: none;
            padding: 30px 10px;
            animation: fadeIn 0.5s;
        }

        .success-icon {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .thank-you-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 24px;
            color: #ff0055;
            margin-bottom: 20px;
            line-height: 1.5;
            text-shadow: 2px 2px 0px rgba(255, 0, 85, 0.15);
        }

        .thank-you-sub {
            font-size: 18px;
            color: #666;
            font-weight: 600;
            line-height: 1.5;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="vote-card">
        
        <!-- SELVE AVSTEMNINGEN -->
        <div id="vote-screen">
            <div class="arcade-title">AVSTEMMING</div>
            <div class="question-text">
                Hva er enklest å balansere?<br>
                En stang uten vekt, eller med vekt i toppen?
            </div>
            
            <!-- KNAPP 1: UTEN VEKT -->
            <button class="vote-btn btn-neutral" onclick="sendVote('uten')">
                <div class="btn-icon">
                    <svg viewBox="0 0 100 140" width="100" height="140" xmlns="http://www.w3.org/2000/svg">
                        <g stroke="#000000" stroke-width="4" fill="#ffffff" stroke-linejoin="round">
                            <!-- Hovedstang -->
                            <path d="M 40,20 V 120 A 10 5 0 0 0 60 120 V 20 Z" />
                            <ellipse cx="50" cy="20" rx="10" ry="5" />
                        </g>
                    </svg>
                </div>
                <div class="btn-text">UTEN<br>VEKT</div>
            </button>
            
            <!-- KNAPP 2: MED VEKT -->
            <button class="vote-btn btn-neutral" onclick="sendVote('med')">
                <div class="btn-icon">
                    <svg viewBox="0 0 100 140" width="100" height="140" xmlns="http://www.w3.org/2000/svg">
                        <g stroke="#000000" stroke-width="4" fill="#ffffff" stroke-linejoin="round">
                            <!-- Nederste stang -->
                            <path d="M 40,50 V 120 A 10 5 0 0 0 60 120 V 50 Z" />
                            
                            <!-- Vekt-disken -->
                            <path d="M 10,30 V 50 A 40 20 0 0 0 90 50 V 30 Z" />
                            <ellipse cx="50" cy="30" rx="40" ry="20" />
                            
                            <!-- Øverste lille stang -->
                            <path d="M 40,20 V 30 A 10 5 0 0 0 60 30 V 20 Z" />
                            <ellipse cx="50" cy="20" rx="10" ry="5" />
                        </g>
                    </svg>
                </div>
                <div class="btn-text">MED<br>VEKT</div>
            </button>
        </div>

        <!-- KVITTERING ETTER VALG -->
        <div id="thank-you-screen">
            <div class="success-icon">
                <svg viewBox="0 0 14 11" width="120" height="120" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(4px 4px 0px rgba(0, 168, 150, 0.15));">
                    <rect x="0" y="5" width="2" height="2" fill="#00A896"/>
                    <rect x="2" y="7" width="2" height="2" fill="#00A896"/>
                    <rect x="4" y="9" width="2" height="2" fill="#00A896"/>
                    <rect x="6" y="7" width="2" height="2" fill="#00A896"/>
                    <rect x="8" y="5" width="2" height="2" fill="#00A896"/>
                    <rect x="10" y="3" width="2" height="2" fill="#00A896"/>
                    <rect x="12" y="1" width="2" height="2" fill="#00A896"/>
                </svg>
            </div>
            <div class="thank-you-title">TAKK FOR<br>DIN STEMME!</div>
            <div class="thank-you-sub">Følg med på storskjermen, etter at vi har spilt og forsket, for å se hva folk trodde.</div>
        </div>

    </div>

    <script>
        function sendVote(valg) {
            document.getElementById('vote-screen').style.display = 'none';
            document.getElementById('thank-you-screen').style.display = 'block';
            
            // Her skal databasen (Firebase) kobles på senere!
            console.log("Brukeren stemte på: " + valg);
        }
    </script>
</body>
</html>
